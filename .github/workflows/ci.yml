name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-node:
    name: Node.js Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['18.x', '20.x', '22.x', '24.x']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate parser
        run: npm run generate

      - name: Run parser tests
        run: npm test

      - name: Build parser & bindings
        run: npm run build

  test-c:
    name: C Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies & generate parser
        run: |
          npm ci
          echo "$PWD/node_modules/.bin" >> $GITHUB_PATH
          npm run generate

      - name: Run C binding tests
        run: make test-c

      - name: Build with CMake
        run: |
          cmake -B cmake-build
          cmake --build cmake-build

  test-go:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies & generate parser
        run: |
          npm ci
          npm run generate

      - name: Run Go tests
        run: go test -v ./...

  test-python:
    name: Python Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies & generate parser
        run: |
          npm ci
          npm run generate
          python -m pip install --upgrade pip
          pip install pytest tree-sitter
          pip install .

      - name: Run Python tests
        run: pytest bindings/python/tests

  test-rust:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies & generate parser
        run: |
          npm ci
          npm run generate

      - name: Run Rust tests
        run: cargo test --all-targets

  test-swift:
    name: Swift Tests
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies & generate parser
        run: |
          npm ci
          npm run generate

      - name: Run Swift tests
        run: swift test

  build-wasm:
    name: Build WebAssembly Target
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Emscripten SDK
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 'latest'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build WASM
        run: npm run build:wasm

      - name: Test WASM
        run: npm run test:wasm

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v7
        with:
          name: tree-sitter-groovy-wasm
          path: tree-sitter-groovy.wasm
          if-no-files-found: error
